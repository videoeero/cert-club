<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <!-- Rounded "Soap / Badge" slab base -->
  <rect x="2" y="2" width="28" height="28" rx="7" fill="#0E9384"/>

  <!-- Subtle top-edge highlight for a stamped/embossed tactile feel -->
  <rect x="2" y="2" width="28" height="14" rx="7" fill="#1BC2AC"/>
  <rect x="2" y="10" width="28" height="6" fill="#1BC2AC"/>

  <!-- Inner doc / credential outline -->
  <rect x="6" y="6" width="20" height="20" rx="4" fill="none" stroke="#FFFFFF" stroke-width="1.75" opacity="0.35"/>

  <!-- Bold verified/passed checkmark -->
  <path d="M9.5 16.5 L14 21 L22.5 11" 
        fill="none" 
        stroke="#FFFFFF" 
        stroke-width="3.5" 
        stroke-linecap="round" 
        stroke-linejoin="round"/>
</svg>
