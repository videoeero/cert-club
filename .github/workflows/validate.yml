name: Validate

on:
  # main is deliberately excluded: Deploy already runs `npm run check` before
  # building, so validating it here would run the whole suite twice per push.
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

# Supersede a branch's earlier run when it is pushed again mid-check.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and fixtures
        run: npm run check
      # `npm run check` is deliberately content- and lint-only, so neither
      # `tsc -b` nor the Vite build runs inside it. Without this step a type
      # error or a broken bundle passes every pull request and first surfaces
      # on main, where it fails Deploy rather than review. Mirrors the Build
      # step in deploy.yml so a branch fails here, not there.
      - name: Typecheck and build
        run: npm run build
