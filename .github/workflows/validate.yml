name: Validate

on:
  # main is deliberately excluded: Deploy already runs `npm run check` before
  # building, so validating it here would run the whole suite twice per push.
  push:
    branches-ignore: [main]
  pull_request:

permissions:
  contents: read

# Supersede a branch's earlier run when it is pushed again mid-check.
concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  content:
    name: Content schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and fixtures
        run: npm run check
