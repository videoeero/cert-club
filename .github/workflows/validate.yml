name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  content:
    name: Content schema
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Validate content and fixtures
        run: npm run check
