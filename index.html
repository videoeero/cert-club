<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Open, non-paywalled practice exams for vendor certifications, built from public documentation."
    />
    <title>Cert Club — open certification practice</title>

    <!-- Applies a stored theme before first paint. Must stay in <head> and
         stay a classic (non-module) script so it runs during parse. -->
    <script>
      try {
        var t = localStorage.getItem("cert-club.theme");
        if (t === "dark" || t === "light")
          document.documentElement.dataset.theme = t;
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
